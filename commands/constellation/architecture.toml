description = "Get a high-level overview of the codebase architecture"

prompt = """
**IMPORTANT: Do NOT invoke any skills or other commands. Directly call the MCP tool specified below.**

Retrieve a high-level architectural overview of the codebase using the Constellation `code_intel` tool with `getArchitectureOverview({ includeMetrics: true, includeModuleGraph: false })`.

**Present the following:**

1. **Project Summary**
   - Primary language (result.data.metadata.primaryLanguage) and detected frameworks (result.data.metadata.frameworks)
   - Total files (result.data.metadata.totalFiles) and total symbols (result.data.structure.symbols.total)

2. **Language Distribution**
   - For each language in result.data.metadata.languages, show name (language), file count (fileCount), and percentage of codebase (percentage).

3. **Symbol Breakdown**
   - Top 10 symbol kinds from result.data.structure.symbols.byKind (functions, classes, interfaces, etc.) with counts, plus the exported count (result.data.structure.symbols.exported).

4. **Dependency Hotspots**
   - Most connected files from result.data.dependencies.internal.mostConnectedFiles (path, incoming/outgoing counts; these are the hub modules of the codebase) and top external packages from result.data.dependencies.external.topPackages.

5. **Quality Metrics** (only if result.data.metrics is present)
   - Average complexity and high-complexity count (metrics.complexity), maintainability score and issues (metrics.maintainability), and test coverage percentage if available (metrics.testCoverage).

6. **Observations** (optional insights):
   - Note if it's heavily function-based vs class-based, multi-language codebase characteristics, and concentration of connections in a few hub files.

Keep the output concise and scannable. Focus on giving a quick mental model of the codebase structure.
"""
